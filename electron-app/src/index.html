<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PI Agent Flow</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <!-- logo moved into each screen so it appears inside the white box -->
      <section id="emptyState" class="screen screen-centered">
        <img src="./logo.png" class="app-logo screen-logo" alt="App logo" />
        <div class="folder-prompt">
          <h1>Add folder to Start</h1>
          <button id="chooseFolderButton" class="primary-action" type="button">
            <span aria-hidden="true">+</span>
            <span>ADD FOLDER</span>
          </button>
        </div>
      </section>

      <section id="setupState" class="screen hidden">
        <div class="top-strip">
          <div class="left-controls">
            <img src="./logo.png" class="app-logo screen-logo" alt="App logo" />
            <div class="folder-chip" id="setupFolderName">Folder name</div>
          </div>
          <button id="createFirstAgentButton" class="secondary-action compact" type="button">
            <span aria-hidden="true">+</span>
            <span>Add Agent</span>
          </button>
        </div>
        <div class="setup-message">Create Agent to get started</div>
      </section>

      <section id="agentsState" class="screen hidden">
        <header class="workspace-header">
          <div class="left-controls">
            <img src="./logo.png" class="app-logo screen-logo" alt="App logo" />
            <div class="folder-chip" id="workspaceFolderName">Folder name</div>
          </div>
          <button id="addAgentButton" class="secondary-action" type="button">
            <span aria-hidden="true">+</span>
            <span>ADD AGENT</span>
          </button>
        </header>
        <div id="agentGrid" class="agent-grid" aria-live="polite"></div>
      </section>
    </main>

    <div id="agentRolePicker" class="role-picker hidden" role="dialog" aria-modal="true" aria-labelledby="agentRoleTitle">
      <div class="role-picker-card">
        <h2 id="agentRoleTitle">Choose agent type</h2>
        <label class="role-picker-label" for="agentRoleSelect">Agent type</label>
        <select id="agentRoleSelect" class="role-picker-select"></select>
        <label class="role-picker-label" for="agentModelSelect">Model</label>
        <select id="agentModelSelect" class="role-picker-select"></select>
        <div class="role-picker-actions">
          <button id="agentRoleCancel" class="secondary-action compact" type="button">Cancel</button>
          <button id="agentRoleCreate" class="secondary-action compact" type="button">Create</button>
        </div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
